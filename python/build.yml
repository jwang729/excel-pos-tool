name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install packages
      run: |
        pip install pyinstaller openpyxl

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --name POS_Data_Fix_Tool excel_tool.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: POS-EXE
        path: dist/POS_Data_Fix_Tool.exe