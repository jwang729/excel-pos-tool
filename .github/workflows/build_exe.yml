name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout source
      uses: actions/checkout@v4

    - name: 2. Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install dependencies
      run: |
        pip install pyinstaller openpyxl

    - name: 4. Build EXE
      run: |
        pyinstaller --onefile --noconsole --name POS_Data_Fix_Tool excel_tool.py

    - name: 5. Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: POS-EXE
        path: dist/POS_Data_Fix_Tool.exe